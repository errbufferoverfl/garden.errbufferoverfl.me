project:
  type: website
  output-dir: public
  lib-dir: static
  resources:
    - "resources/*"
  preview:
    port: 8086
    browser: true
    watch-inputs: true
    navigate: false
  render:
    - "*.qmd"
    - "*.md"
  post-render:
    - python3 _utils/xsl4quarto.py
website:
  title: "errbufferoverfl, enthusiastic zinester & artist, reluctant security engineer"
  site-url: https://garden.errbufferoverfl.me
  description: "Notes about society, microfarming, and sometimes security engineering."
  open-graph:
    locale: en_EN
    site-name: garden.errbufferoverfl.me
  repo-url: https://gitlab.com/errbufferoverfl/garden-errbufferoverfl-me
  issue-url: https://gitlab.com/errbufferoverfl/garden-errbufferoverfl-me/-/issues
  repo-branch: hugo
  repo-actions:
    - edit
    - source
    - issue
  search:
    location: navbar
    type: overlay
    copy-button: true
    show-item-context: true
  page-navigation: false
  back-to-top-navigation: false
  bread-crumbs: true
  navbar:
    pinned: true
    background: light
    right:
      - text: The Notebook
        menu:
          - text: Writing
            href: /
          - text: Lists
            href: /lists/
      - text: The Zine Wiki
        url: /zine/
      - text: The Soapbox
        url: /soapbox/
      - text: "About"
        href: "about.qmd"
  page-footer:
    border: false
    center:
      - text: "RSS"
        aria-label: "RSS"
        href: "index.xml"
      - text: "Sitemap"
        aria-label: "Sitemap"
        href: "sitemap.xml"
      - text: "Quarto v<?quarto.version?>"
        aria-label: "Quarto"
        href: "https://quarto.org/"
    right:
      - text: "Contact"
        aria-label: "Contact Form"
        href: "contact.html"
      - text: "License"
        aria-label: "License Details"
        href: "license.html"

format:
  html:
    lang: en
    author-meta: errbufferoverfl
    theme: cosmo
    css:
      - resources/styles.css
    link-external-newwindow: true
    highlight-style: dracula
    anchor-sections: true
    callout-appearance: simple
    email-obfuscation: javascript
    title-block-style: default
    appendix-style: plain
    appendix-cite-as: display
    toc: true
    toc-title: "Table of Contents"
    toc-location: right
    fig-align: center
    fig-responsive: true
    code-line-numbers: true
    code-fold: true
    code-annotations: true
    code-overflow: scroll
    code-copy: hover
    comments:
      hypothesis:
        theme: clean
        openSidebar: false
        showHighlights: whenSidebarOpen
    grid:
      sidebar-width: 300px
      body-width: 600px
      margin-width: 300px
      gutter-width: 1.5rem

execute:
  freeze: auto
  warning: false
  message: false

filters:
  - _utils/quarto-version.lua